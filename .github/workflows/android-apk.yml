name: Android APK Build & Artifact Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify-apk:
    name: Build Android APK & Verify Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 4. Setup Android SDK & Build Tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: 5. Accept Android Licenses & Ensure API 34
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: 6. Deterministic Dependency Installation
        run: |
          echo "Installing Node dependencies with npm ci..."
          npm ci

      - name: 7. Verify Toolchain Environment Versions
        run: |
          echo "=== TOOLCHAIN ENVIRONMENT ==="
          echo "Node.js: $(node -v)"
          echo "npm:     $(npm -v)"
          echo "Java:    $(java -version 2>&1 | head -n 1)"
          echo "Javac:   $(javac -version 2>&1 | head -n 1)"
          echo "ANDROID_HOME: $ANDROID_HOME"
          cd android && ./gradlew --version && cd ..

      - name: 8. TypeScript & Static Code Verification
        run: |
          echo "Executing TypeScript type validation (tsc --noEmit)..."
          npm run lint

      - name: 9. Static Security & Dev Endpoint Audit
        run: |
          echo "Auditing source files for forbidden development URLs and plaintext secrets..."
          if grep -rn "localhost" src/; then
            echo "❌ ERROR: Found localhost references in src/"
            exit 1
          fi
          if grep -rn "127.0.0.1" src/; then
            echo "❌ ERROR: Found 127.0.0.1 references in src/"
            exit 1
          fi
          echo "✔ Security audit passed: No localhost/development endpoints in production source."

      - name: 10. Execute Full Regression Test Suite (497/497 Baseline)
        run: |
          echo "Running complete Phase 1 through Phase 7 test suites..."
          npm run test

      - name: 11. Build Vite Production Web Assets
        run: |
          echo "Building production web assets..."
          npm run build

      - name: 12. Synchronize Capacitor Android Project
        run: |
          echo "Synchronizing Capacitor Android assets..."
          npm run cap:sync

      - name: 13. Build Real Android APK (Gradle assembleDebug)
        run: |
          echo "Executing Gradle assembleDebug..."
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cd ..

      - name: 14. Verify APK, Compute SHA-256 & Generate Reports
        run: |
          chmod +x scripts/verify-apk.sh
          ./scripts/verify-apk.sh

      - name: 15. Upload Verified APK & Metadata Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smart-pharmacy-erp-phase8.1-android-debug
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
