name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js v22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Web Dependencies
        run: npm ci || npm install

      - name: Build Web Assets
        run: npm run build

      - name: Real Gemini OCR Integration Gate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is not configured in GitHub Actions secrets."
            exit 1
          fi
          npm run dev > /tmp/smart-pharmacy-ocr-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "OCR server did not become ready."
              exit 1
            fi
            sleep 1
          done
          set +e
          npx tsx tests/test_phase8_10_ocr_diagnostic.ts
          test_status=$?
          if [ "$test_status" -ne 0 ]; then
            echo "--- OCR server diagnostic log (secrets redacted by GitHub masking) ---"
            sed -E 's/(key|token|authorization|api[-_]?key)[=:][^ ]+/\1=[REDACTED]/Ig' /tmp/smart-pharmacy-ocr-server.log || true
          fi
          exit "$test_status"

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Accept Android Licenses & Setup SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Ensure Debug Keystore Exists
        run: |
          if [ ! -f "android/app/debug.keystore" ]; then
            echo "Generating consistent debug keystore..."
            keytool -genkeypair -v \
              -keystore android/app/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Make Gradlew Executable
        run: chmod +x ./android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Artifact and Release
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/SmartPharmacy.apk
          cd release-apk
          sha256sum SmartPharmacy.apk > sha256.txt
          cat sha256.txt

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartPharmacy-APK
          path: |
            release-apk/SmartPharmacy.apk
            release-apk/sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with Direct APK Download
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1-phase8.5-apk
          name: Smart Pharmacy ERP - APK v1.0.1 (Phase 8.5)
          body: |
            تطبيق نظام الصيدلية الذكي بصيغة APK جاهز للتحميل والتثبيت المباشر على جميع هواتف وأجهزة أندرويد (Version Code: 2, Version: 1.0.1).
            
            ### تعليمات التثبيت:
            1. حمل ملف `SmartPharmacy.apk`.
            2. افتح الملف واضغط "تثبيت" (إذا ظهر تحذير التثبيت من مصادر غير معروفة، اضغط سماح/متابعة).
            3. في حال وجود نسخة قديمة مسبقة بتوقيع مختلف، قم بإلغاء تثبيت النسخة القديمة أولاً ثم ثبت النسخة الجديدة.
          files: |
            release-apk/SmartPharmacy.apk
            release-apk/sha256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
