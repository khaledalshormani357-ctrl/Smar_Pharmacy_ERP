<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Smart Pharmacy ERP</title>
    <meta name="description" content="نظام إدارة الصيدليات الذكي المتكامل - نقطة بيع POS، إدارة المخزون والدفعات FEFO، المشتريات والعمليات المالية، ومساعد الصيدلية الذكي Smart Pharmacy Copilot" />
    <meta property="og:title" content="Smart Pharmacy ERP" />
    <meta property="og:description" content="نظام إدارة الصيدليات الذكي المتكامل - نقطة بيع POS، إدارة المخزون والدفعات FEFO، المشتريات والعمليات المالية، ومساعد الصيدلية الذكي Smart Pharmacy Copilot" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('smart_pharmacy_theme_mode');
          var isDark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F8FAFC] text-slate-900 font-['Cairo',sans-serif] antialiased select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
